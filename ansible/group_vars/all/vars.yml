---
# Variables partagées par tous les hosts (non sensibles).

# --- Application ---
app_image: "VOTRE_DOCKERHUB_USERNAME/tp-devops-exam:latest"
app_port: 8080

# --- Domaine principal (ex: mondomaine.com) ---
domain_name: "votredomaine.com"
acme_email: "votre@email.com"

# --- SonarQube ---
sonarqube_port: 9000

# --- Prometheus ---
prometheus_port: 9090

# --- Grafana ---
grafana_port: 3000
grafana_admin_user: "admin"
# Le mot de passe Grafana est dans vault.yml (variable grafana_admin_password)

# --- Traefik ---
traefik_dashboard_port: 8081
