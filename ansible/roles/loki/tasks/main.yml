---
# Rôle "loki" : Déploie Loki (agrégation de logs) + Promtail (collecteur Docker).
# Loki écoute sur le port 3100 (accès interne réseau traefik-net uniquement).
# Promtail collecte les logs de tous les conteneurs Docker via /var/log/docker.

- name: Créer les répertoires Loki
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"
  loop:
    - /opt/loki/data
    - /opt/loki/config
  become: true

- name: Déployer la configuration Loki
  ansible.builtin.copy:
    dest: /opt/loki/config/loki-config.yml
    owner: "10001"
    group: "10001"
    mode: "0644"
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      query_range:
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_mb: 100

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      ruler:
        alertmanager_url: http://localhost:9093

      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 168h
  become: true

- name: Lancer Loki
  ansible.builtin.shell: |
    docker stop loki 2>/dev/null || true
    docker rm loki 2>/dev/null || true
    docker run -d \
      --name loki \
      --restart always \
      --network traefik-net \
      -p 3100:3100 \
      -v /opt/loki/data:/loki \
      -v /opt/loki/config/loki-config.yml:/etc/loki/local-config.yaml:ro \
      grafana/loki:latest \
      -config.file=/etc/loki/local-config.yaml
  become: true

- name: Créer le répertoire de configuration Promtail
  ansible.builtin.file:
    path: /opt/promtail/config
    state: directory
    mode: "0755"
  become: true

- name: Déployer la configuration Promtail
  ansible.builtin.copy:
    dest: /opt/promtail/config/promtail-config.yml
    mode: "0644"
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://loki:3100/loki/api/v1/push

      scrape_configs:
        - job_name: docker-containers
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 5s
          relabel_configs:
            - source_labels: ['__meta_docker_container_name']
              regex: '/(.*)'
              target_label: 'container'
            - source_labels: ['__meta_docker_container_log_stream']
              target_label: 'logstream'
            - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
              target_label: 'service'
  become: true

- name: Lancer Promtail (collecte des logs Docker)
  ansible.builtin.shell: |
    docker stop promtail 2>/dev/null || true
    docker rm promtail 2>/dev/null || true
    docker run -d \
      --name promtail \
      --restart always \
      --network traefik-net \
      -v /opt/promtail/config/promtail-config.yml:/etc/promtail/config.yml:ro \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v /var/lib/docker/containers:/var/lib/docker/containers:ro \
      grafana/promtail:latest \
      -config.file=/etc/promtail/config.yml
  become: true

- name: Vérifier que Loki est démarré
  ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' loki
  register: loki_status
  changed_when: false

- name: Vérifier que Promtail est démarré
  ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' promtail
  register: promtail_status
  changed_when: false

- name: Afficher les statuts Loki + Promtail
  ansible.builtin.debug:
    msg: |
      Loki running: {{ loki_status.stdout }}
        -> http://{{ ansible_host }}:3100
        -> Datasource Grafana : http://loki:3100
      Promtail running: {{ promtail_status.stdout }}
        -> Collecte les logs de tous les conteneurs Docker
