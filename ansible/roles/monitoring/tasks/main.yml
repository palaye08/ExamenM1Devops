---
# Rôle "monitoring" : Prometheus (collecte métriques) + Grafana (visualisation).
# Prometheus est accessible sur le port 9090.
# Grafana est accessible sur le port 3000 ET via https://grafana.{{ domain_name }}
#
# Pour visualiser les métriques de votre instance sur le port 3000 :
# -> http://VOTRE_IP_EC2:3000  (login: admin / vault_grafana_admin_password)
# -> Ajouter Prometheus comme datasource : http://prometheus:9090
# -> Importer le dashboard "Node Exporter Full" (ID: 1860) depuis grafana.com

- name: Créer les répertoires Prometheus
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "65534"   # nobody (UID Prometheus)
    group: "65534"
    mode: "0755"
  loop:
    - /opt/prometheus
    - /opt/prometheus/data
  become: true

- name: Déployer la configuration Prometheus (prometheus.yml)
  ansible.builtin.copy:
    dest: /opt/prometheus/prometheus.yml
    owner: "65534"
    group: "65534"
    mode: "0644"
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        # Métriques de Prometheus lui-même
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        # Métriques système de l'instance EC2 (via Node Exporter)
        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']

        # Métriques de l'application (Spring Boot Actuator / /actuator/prometheus)
        - job_name: 'app'
          metrics_path: '/actuator/prometheus'
          static_configs:
            - targets: ['app:8080']

        # Métriques SonarQube
        - job_name: 'sonarqube'
          static_configs:
            - targets: ['sonarqube:9000']
  become: true

- name: Créer les répertoires Grafana (data + provisioning)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"
  loop:
    - /opt/grafana/data
    - /opt/grafana/provisioning/datasources
    - /opt/grafana/provisioning/dashboards
    - /opt/grafana/dashboards
  become: true

- name: Copier la datasource Prometheus + Loki
  ansible.builtin.copy:
    src: provisioning/datasources/datasource.yml
    dest: /opt/grafana/provisioning/datasources/datasource.yml
    owner: "472"
    group: "472"
    mode: "0644"
  become: true

- name: Copier la configuration de provisioning des dashboards
  ansible.builtin.copy:
    src: provisioning/dashboards/dashboards.yml
    dest: /opt/grafana/provisioning/dashboards/dashboards.yml
    owner: "472"
    group: "472"
    mode: "0644"
  become: true

- name: Copier les dashboards JSON
  ansible.builtin.copy:
    src: "dashboards/{{ item }}"
    dest: "/opt/grafana/dashboards/{{ item }}"
    owner: "472"
    group: "472"
    mode: "0644"
  loop:
    - node-exporter-full.json
    - spring-boot-app.json
    - production-dashboard.json
  become: true

- name: Lancer Node Exporter (métriques système de l'instance)
  ansible.builtin.shell: |
    docker stop node-exporter 2>/dev/null || true
    docker rm node-exporter 2>/dev/null || true
    docker run -d \
      --name node-exporter \
      --restart always \
      --network traefik-net \
      -p 9100:9100 \
      --pid="host" \
      -v /proc:/host/proc:ro \
      -v /sys:/host/sys:ro \
      -v /:/rootfs:ro \
      prom/node-exporter:latest \
      --path.procfs=/host/proc \
      --path.rootfs=/rootfs \
      --path.sysfs=/host/sys \
      --collector.filesystem.mount-points-exclude='^/(sys|proc|dev|host|etc)($$|/)'
  become: true

- name: Lancer Prometheus
  ansible.builtin.shell: |
    docker stop prometheus 2>/dev/null || true
    docker rm prometheus 2>/dev/null || true
    docker run -d \
      --name prometheus \
      --restart always \
      --network traefik-net \
      -p 9090:9090 \
      -v /opt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
      -v /opt/prometheus/data:/prometheus \
      prom/prometheus:latest \
      --config.file=/etc/prometheus/prometheus.yml \
      --storage.tsdb.path=/prometheus \
      --web.console.libraries=/etc/prometheus/console_libraries \
      --web.console.templates=/etc/prometheus/consoles \
      --web.enable-lifecycle
  become: true

- name: Arrêter et supprimer l'ancien conteneur Grafana (force recréation)
  ansible.builtin.shell: |
    docker stop grafana 2>/dev/null || true
    docker rm -f grafana 2>/dev/null || true
  become: true

- name: Attendre que l'ancien conteneur Grafana soit bien supprimé
  ansible.builtin.shell: |
    for i in $(seq 1 10); do
      docker ps -a --filter name=grafana --format '{{.Names}}' | grep -q grafana || exit 0
      sleep 1
    done
    exit 1
  become: true

- name: Lancer Grafana avec provisioning as-code (dashboards + datasources)
  ansible.builtin.shell: |
    docker run -d \
      --name grafana \
      --restart always \
      --network traefik-net \
      -p 3000:3000 \
      -v /opt/grafana/data:/var/lib/grafana \
      -v /opt/grafana/provisioning:/etc/grafana/provisioning:ro \
      -v /opt/grafana/dashboards:/var/lib/grafana/dashboards:ro \
      -e GF_SECURITY_ADMIN_USER="{{ grafana_admin_user }}" \
      -e GF_SECURITY_ADMIN_PASSWORD="Admin1234!" \
      -e GF_SERVER_DOMAIN="grafana.{{ domain_name }}" \
      -e GF_SERVER_ROOT_URL="https://grafana.{{ domain_name }}" \
      -e GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH="/var/lib/grafana/dashboards/production-dashboard.json" \
      --label "traefik.enable=true" \
      --label "traefik.http.routers.grafana.rule=Host(\`grafana.{{ domain_name }}\`)" \
      --label "traefik.http.routers.grafana.entrypoints=websecure" \
      --label "traefik.http.routers.grafana.tls.certresolver=letsencrypt" \
      --label "traefik.http.services.grafana.loadbalancer.server.port=3000" \
      grafana/grafana:latest
  become: true

- name: Attendre que Grafana soit prêt (API health)
  ansible.builtin.shell: |
    for i in $(seq 1 20); do
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
      echo "[Tentative $i/20] Grafana HTTP=$STATUS"
      [ "$STATUS" = "200" ] && exit 0
      sleep 3
    done
    echo "TIMEOUT: Grafana n'a pas répondu en 60s"
    exit 1
  become: true
  changed_when: false

- name: Vérifier que Prometheus est démarré
  ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' prometheus
  register: prom_status
  changed_when: false

- name: Vérifier que Grafana est démarré
  ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' grafana
  register: grafana_status
  changed_when: false

- name: Santé finale Grafana (curl)
  ansible.builtin.shell: curl -sf http://localhost:3000/api/health
  register: grafana_health
  changed_when: false
  become: true

- name: Santé finale Prometheus (curl)
  ansible.builtin.shell: curl -sf http://localhost:9090/-/healthy
  register: prom_health
  changed_when: false
  become: true

- name: Afficher les statuts monitoring
  ansible.builtin.debug:
    msg: |
      Prometheus running: {{ prom_status.stdout }}
        -> http://{{ ansible_host }}:9090
        -> Health: {{ prom_health.stdout }}
      Grafana running: {{ grafana_status.stdout }}
        -> http://{{ ansible_host }}:3000 (port direct)
        -> https://grafana.{{ domain_name }} (via Traefik + HTTPS)
        -> Health: {{ grafana_health.stdout }}
      Identifiants Grafana : {{ grafana_admin_user }} / Admin1234!
      Dashboards auto-provisionnés : EC2 Node Exporter / Spring Boot App / Production Overview
