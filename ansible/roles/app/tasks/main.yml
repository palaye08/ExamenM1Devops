---
# Rôle "app" : déploiement de l'application sur l'instance prod.
# L'image Docker est construite et poussée par le CI/CD (GitHub Actions).
# Accessible via : https://app.{{ domain_name }}

- name: Vérifier si l'image Docker est disponible sur Docker Hub
  ansible.builtin.command: "docker pull {{ app_image }}"
  become: true
  register: pull_result
  ignore_errors: true

- name: Arrêter et supprimer l'ancien conteneur applicatif (si image disponible)
  ansible.builtin.shell: |
    docker stop app 2>/dev/null || true
    docker rm app 2>/dev/null || true
  become: true
  when: pull_result.rc == 0

- name: Lancer le conteneur applicatif
  ansible.builtin.shell: |
    docker run -d \
      --name app \
      --restart always \
      --network traefik-net \
      -p {{ app_port }}:8080 \
      -e MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE="health,info,prometheus,metrics" \
      -e MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS="always" \
      --label "traefik.enable=true" \
      --label "traefik.http.routers.app.rule=Host(\`app.{{ domain_name }}\`)" \
      --label "traefik.http.routers.app.entrypoints=websecure" \
      --label "traefik.http.routers.app.tls.certresolver=letsencrypt" \
      --label "traefik.http.services.app.loadbalancer.server.port=8080" \
      {{ app_image }}
  become: true
  when: pull_result.rc == 0

- name: Afficher message si image non disponible
  ansible.builtin.debug:
    msg: |
      ⚠️  Image {{ app_image }} non disponible sur Docker Hub.
      Le déploiement de l'app sera fait automatiquement par le CI/CD
      après le premier push sur la branche main.
  when: pull_result.rc != 0

- name: Vérifier que l'application est démarrée
  ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' app
  register: app_status
  changed_when: false
  failed_when: false
  when: pull_result.rc == 0

- name: Afficher le statut de l'application
  ansible.builtin.debug:
    msg: |
      Application running: {{ app_status.stdout | default('not started') }}
        -> http://{{ ansible_host }}:{{ app_port }}
        -> https://app.{{ domain_name }} (via Traefik + HTTPS)
  when: pull_result.rc == 0
