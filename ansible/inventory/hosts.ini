# Inventaire Ansible - remplir avec l'IP obtenue via : terraform output prod_public_ip
# Exemple : ansible_host=1.2.3.4

[prod]
prod_server ansible_host=52.8.34.134 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_user                 = ec2-user
ansible_ssh_private_key_file = ~/.ssh/id_rsa
