spring.application.name=tp-devops-exam

# Serveur
server.port=8080

# Base de données (H2 pour les tests, MySQL en prod via variables d'env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:examdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Actuator / Monitoring ──
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ── Swagger UI / OpenAPI 3 ──
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
