# =========================================================
# CI/CD Pipeline - Exam DevOps
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   DOCKER_USERNAME     - Nom d'utilisateur Docker Hub
#   DOCKER_PASSWORD     - Token Docker Hub / mot de passe
#   EC2_HOST            - IP publique de l'instance EC2 prod (Elastic IP)
#   EC2_USER            - Utilisateur SSH (ec2-user)
#   SSH_PRIVATE_KEY     - Clé SSH privée pour se connecter à l'instance
#   SONAR_TOKEN         - Token d'accès SonarQube (généré dans SonarQube)
#   SONAR_HOST_URL      - URL SonarQube (ex: https://sonarqube.mondomaine.com)
#
# Déclencheur : push sur la branche main uniquement.
# La branche main est protégée (push direct bloqué, PR obligatoire).
#
# Job 1 (test)         : Tests unitaires + rapport de couverture
# Job 2 (sonarqube)    : Analyse qualité du code via SonarQube
# Job 3 (build-push)   : Build Docker image + push sur Docker Hub
# Job 4 (deploy)       : Déploiement SSH sur l'instance EC2 prod
# =========================================================

name: CI/CD - Exam DevOps (prod)

on:
  push:
    branches:
      - main   # Déclenchement uniquement sur main

jobs:
  # ── Job 1 : Tests unitaires ───────────────────────────────────────────────────
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"
          cache: maven

      - name: Exécuter les tests Maven
        run: mvn test

      - name: Publier le rapport de couverture (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

  # ── Job 2 : Analyse SonarQube ─────────────────────────────────────────────────
  sonarqube:
    name: Analyse SonarQube (qualité du code)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour l'analyse complète SonarQube

      - name: Configurer Java 21 (requis par SonarQube Scanner 4.x)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven

      - name: Debug - vérifier que SONAR_HOST_URL est défini
        run: |
          echo "Longueur de SONAR_HOST_URL : ${#SONAR_URL}"
          if [ -z "$SONAR_URL" ]; then
            echo "❌ ERREUR : Le secret SONAR_HOST_URL est VIDE. Vérifiez dans GitHub Settings → Secrets."
            exit 1
          fi
          echo "✅ SONAR_HOST_URL est défini (${#SONAR_URL} caractères), commence par : ${SONAR_URL:0:8}..."
        env:
          SONAR_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Attendre que SonarQube soit prêt (status UP)
        run: |
          SONAR_URL="${{ secrets.SONAR_HOST_URL }}"
          echo "🔍 URL SonarQube interrogée : ${SONAR_URL}"
          echo "🔍 Endpoint complet : ${SONAR_URL}/api/system/status"
          echo "---"
          MAX_ATTEMPTS=20
          SLEEP_INTERVAL=15
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -s -o /tmp/sonar_response.json -w "%{http_code}" -m 10 "${SONAR_URL}/api/system/status" 2>/dev/null || echo "000")
            BODY=$(cat /tmp/sonar_response.json 2>/dev/null || echo "")
            STATUS=$(echo "$BODY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "")
            
            echo "[Tentative ${ATTEMPT}/${MAX_ATTEMPTS}] HTTP=${HTTP_CODE} | Status=${STATUS:-INCONNU} | Body=${BODY:-vide}"
            
            if [ "$STATUS" = "UP" ]; then
              echo "✅ SonarQube est prêt !"
              exit 0
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⏳ Prochaine tentative dans ${SLEEP_INTERVAL}s..."
              sleep $SLEEP_INTERVAL
            fi
          done
          echo "❌ SonarQube n'est pas devenu UP après ${MAX_ATTEMPTS} tentatives ($(( MAX_ATTEMPTS * SLEEP_INTERVAL ))s)"
          exit 1

      - name: Analyse SonarQube
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=tp-devops-exam \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ── Job 3 : Build & Push Docker ───────────────────────────────────────────────
  build-and-push:
    name: Build et Push image Docker
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build de l'image Docker (latest)
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/tp-devops-exam:latest .

      - name: Build de l'image Docker (SHA commit)
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/tp-devops-exam:${{ github.sha }} .

      - name: Push de l'image (latest)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tp-devops-exam:latest

      - name: Push de l'image (SHA commit)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tp-devops-exam:${{ github.sha }}

  # ── Job 4 : Déploiement sur EC2 Prod ─────────────────────────────────────────
  deploy:
    name: Déploiement sur l'instance EC2 Prod
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Déploiement SSH sur l'instance prod
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull de la nouvelle image
            docker pull ${{ secrets.DOCKER_USERNAME }}/tp-devops-exam:latest

            # Arrêter et supprimer l'ancien conteneur
            docker stop app 2>/dev/null || true
            docker rm app 2>/dev/null || true

            # Lancer le nouveau conteneur avec Traefik labels
            docker run -d \
              --name app \
              --restart always \
              --network traefik-net \
              -p 8080:8080 \
              -e MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE="health,info,prometheus,metrics" \
              -e MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS="always" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.app.rule=Host(\`app.diopshop.duckdns.org\`)" \
              --label "traefik.http.routers.app.entrypoints=websecure" \
              --label "traefik.http.routers.app.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.app.loadbalancer.server.port=8080" \
              ${{ secrets.DOCKER_USERNAME }}/tp-devops-exam:latest

            echo "✅ Déploiement terminé - SHA: ${{ github.sha }}"

      - name: Vérification de santé de l'application
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8080/actuator/health || echo "000")
          echo "Application health status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Application démarrée avec succès"
          else
            echo "⚠️  Application non disponible (HTTP $STATUS) - vérifier les logs"
          fi
